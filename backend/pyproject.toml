[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-landing-navigator-backend"
version = "0.1.0"
description = "Scientific backend of the Lunar Landing Site Navigator (NASA Space Apps 2026): JPL ephemeris + airless LOLA horizon."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "skyfield>=1.49",
    "numpy>=2.0",
    "scipy>=1.13",
    "rasterio>=1.4",
    "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
